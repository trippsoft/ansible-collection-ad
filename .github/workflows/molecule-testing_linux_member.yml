---
name: Molecule - testing_linux_member role
'on':
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    paths:
      - galaxy.yml
      - roles/testing_linux_member/**
      - '!roles/testing_linux_member/.aar_doc.yml'
      - '!roles/testing_linux_member/README.md'
      - '!roles/testing_linux_member/meta/argument_specs.yml'
      - '!roles/testing_linux_member/meta/main.yml'
  push:
    branches:
      - main
    paths:
      - galaxy.yml
      - roles/testing_linux_member/**
      - '!roles/testing_linux_member/.aar_doc.yml'
      - '!roles/testing_linux_member/README.md'
      - '!roles/testing_linux_member/meta/argument_specs.yml'
      - '!roles/testing_linux_member/meta/main.yml'
defaults:
  run:
    working-directory: 'trippsc2.ad'
jobs:
  molecule:
    name: Run Molecule tests
    runs-on:
      - self-hosted
      - linux
      - ansible
      - x64
    strategy:
      fail-fast: false
      matrix:
        box:
          - debian13_base
          - fedora43_base
          - fedora44_base
          - rocky8_cis
          - rocky9_cis
          - rocky10_base
          - ubuntu2204_base
          - ubuntu2404_base
          - ubuntu2604_base
        ansible:
          - '2.16'
          - '2.21'
        exclude:
          - box: rocky8_cis
            ansible: '2.21'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: trippsc2.ad
      - name: Run Molecule tests
        working-directory: 'trippsc2.ad'
        run: |
          source ~/venv/ansible-${{ matrix.ansible }}/bin/activate
          rm -rf ~/.ansible/collections/ansible_collections/*
          cd ./roles/testing_linux_member
          molecule test
          rm -rf ~/.ansible/collections/ansible_collections/*
          deactivate
        env:
          ANSIBLE_FORCE_COLOR: '1'
          PY_COLORS: '1'
          MOLECULE_BOX: ${{ matrix.box }}
          MOLECULE_ANSIBLE_VERSION: ${{ matrix.ansible }}
